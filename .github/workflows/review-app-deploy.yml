name: Review App - Deploy

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

# Serialise every run for a single PR. The deploy job takes a Dokku deploy lock
# on the review app, so two runs overlapping — two pushes in quick succession,
# or an "opened" event followed straight away by a "synchronize" — race for that
# lock and the loser fails.
#
# cancel-in-progress is deliberately false. Cancelling a superseded run would
# save CI minutes, but a cancellation landing mid-deploy is precisely what
# strands the lock and half-advances the app's git repo (see the ps:rebuild
# fallback below). Queueing costs a few minutes; cancelling costs a wedged
# review app.
concurrency:
  group: review-app-pr-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  e2e:
    name: Run E2E tests
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  deploy-review-app:
    name: Build, push, and deploy review app
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.review_app_url.outputs.review_app_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/gradebee:pr-${{ github.event.number }}-${{ github.sha }}
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=review
            VITE_APP_VERSION=pr-${{ github.event.number }}
            VITE_FEATURE_REPORTS_ADMIN_ONLY=${{ vars.VITE_FEATURE_REPORTS_ADMIN_ONLY }}

      - name: Deploy review app via SSH
        uses: appleboy/ssh-action@v1
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: dokku
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: CLERK_SECRET_KEY,MISTRAL_API_KEY,OPENAI_API_KEY,LETSENCRYPT_EMAIL
          script: |
            set -euo pipefail
            APP_NAME="gradebee-pr-${{ github.event.number }}"
            IMAGE="ghcr.io/${{ github.repository_owner }}/gradebee:pr-${{ github.event.number }}-${{ github.sha }}"

            # Create app if it does not already exist
            if ! dokku apps:exists "$APP_NAME" 2>/dev/null; then
              dokku apps:create "$APP_NAME"
              dokku domains:set "$APP_NAME" $APP_NAME.test.gradebee.app
              dokku storage:create data-$APP_NAME
              TARGET=`dokku storage:info data-$APP_NAME --format json | jq -r .host_path`
              # Online backup avoids reading mid-write; copy to the PR-specific DB filename
              sqlite3 /data/gradebee/gradebee.db ".backup ${TARGET}/${APP_NAME}.db"
              dokku storage:mount "$APP_NAME" data-$APP_NAME --container-dir /data
              # Inject backend runtime config; update on every deploy in case secrets rotate
            fi

            dokku config:set --no-restart "$APP_NAME" \
              CLERK_SECRET_KEY="$CLERK_SECRET_KEY" \
              MISTRAL_API_KEY="$MISTRAL_API_KEY" \
              OPENAI_API_KEY="$OPENAI_API_KEY" \
              DB_PATH="/data/${APP_NAME}.db" \
              UPLOADS_DIR="/data/uploads"

            # nginx's unconfigured default is 1m, which rejects voice-note
            # uploads with an HTML 413 before they reach the container. Keep it
            # just above the backend's 25 MB maxUploadSize. Review apps are not
            # provisioned by Ansible, so this mirrors ansible/vars.yml
            # (app_client_max_body_size). The deploy below rebuilds the vhost.
            dokku nginx:set "$APP_NAME" client-max-body-size 26m

            # Deploy the PR image (predeploy script in app.json runs migrations automatically)
            #
            # git:from-image is not atomic: it advances the app's internal git
            # repo to the new image *before* deploying it. A run that dies after
            # that point — a deploy-lock collision, a cancelled job — leaves the
            # repo advanced with the image never released, and every later
            # attempt exits 1 with "No changes detected, skipping git commit".
            # Re-running cannot clear that state. ps:rebuild redeploys from the
            # source already staged in the repo, which is exactly what the
            # failure message tells you to run.
            dokku git:from-image "$APP_NAME" "$IMAGE" || dokku ps:rebuild "$APP_NAME"
            dokku letsencrypt:set ${APP_NAME} email $LETSENCRYPT_EMAIL
            dokku letsencrypt:enable ${APP_NAME}

      - name: Generate review app URL
        id: review_app_url
        run: |
          # Pass the URL to the environment URL via step outputs
          APP_NAME="gradebee-pr-${{ github.event.number }}"
          echo "review_app_url=https://$APP_NAME.test.gradebee.app" >> $GITHUB_OUTPUT
