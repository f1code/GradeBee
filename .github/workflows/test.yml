name: Test

on:
  workflow_call:

jobs:
  test:
    name: Backend & Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm -F frontend typecheck

      - name: E2E typecheck
        run: pnpm run typecheck:e2e

      - name: Install poppler-utils
        run: timeout --kill-after=30s 10m bash -c 'sudo apt-get update && sudo apt-get install -y poppler-utils'

      - name: Backend unit tests
        working-directory: backend
        run: make test

      - name: Install tygo (for check-types)
        run: go install github.com/gzuidhof/tygo@v0.2.21

      - name: Check generated TypeScript types
        working-directory: backend
        run: make check-types

      - name: Frontend unit tests
        run: pnpm -F frontend test --run
