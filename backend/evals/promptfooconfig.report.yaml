description: GradeBee LLM evaluation harness — Report domain

# gradebee-prompt dispatches to build-report-prompt via vars.task.
# gold-reference echoes the reference report; see the gold-reference provider.
prompts:
  - label: gradebee-prompt
    raw: exec:../bin/eval-cli
  - label: gold-reference
    raw: '{{reference}}'

# Providers for report generation.
# gradebee-report is the canonical (production) provider — tracked for
# regressions against the local report baseline (data/eval-baseline-report.json).
# Production routes reports to OpenRouter's EU host (ADR 0006); apiBaseUrl
# pins the eval there too. omitDefaults: see the judge provider below.
providers:
  - id: openrouter:openai/gpt-6-luna
    label: gradebee-report
    prompts: [gradebee-prompt]
    config:
      apiBaseUrl: https://eu.openrouter.ai/api/v1
      omitDefaults: true

  # Comparison / experimental providers:
  # Medium 3.5, production report model until task 193.
  - id: mistral:mistral-medium-3-5
    label: gradebee-report-medium
    prompts: [gradebee-prompt]

  # mistral-large-4, task 190, prompt bbcc024bf1b6, 3 uncached runs: row 0.624
  # vs Medium 0.613, grounding 0.29 vs 0.35, all inside the ±0.15 gold band;
  # 2x latency. Not adopted. It reasons by default, against its docs, and
  # promptfoo's 1024 max_tokens default leaves only the thinking chunk.
  # reasoning_effort: high scored no better (1 run) at ~4 min a report, past
  # llmChatTimeout.
  # - id: mistral:mistral-large-4
  #   label: gradebee-report-large
  #   prompts: [gradebee-prompt]
  #   config:
  #     reasoning_effort: none
  #     max_tokens: 4096

  # gpt-6-luna on OpenAI direct, task 190, prompt bbcc024bf1b6, 3 uncached
  # runs: row 0.817 vs Medium 0.618, grounding 0.94 vs 0.38, 16/27 pass vs
  # 0/27; 26 s a report. Now canonical via OpenRouter EU (task 193).

  # gpt-6.1-sol, task 190 probe, 2 cases: every axis 1.0, 33 s. Judge until
  # task 195.
  # - id: openai:chat:gpt-6.1-sol
  #   label: gradebee-report-sol
  #   prompts: [gradebee-prompt]
  #   config:
  #     omitDefaults: true

  # Grades the reference itself. Its output never changes, so its score
  # moving between runs is judge noise.
  - id: echo
    label: gold-reference
    prompts: [gold-reference]

# Every case shares the task, judge and rubric; generated tests carry only
# vars. The rubric grades adherence to the Level's report_instructions only.
# Report Examples are removed (#54); ad-hoc instructions (teacher overrides)
# still rank above the Level's report_instructions.
#
# One llm-rubric per axis, each its own metric (namedScores). The judge picks
# a 1-5 anchor and returns it as 0-1; threshold is the axis floor. A row
# passes when every axis clears its floor; the row score (axis mean) is for
# trends only. rubricPrompt asks for {reason, score} with no pass, so the
# floors decide pass, not the judge.
defaultTest:
  vars:
    task: build-report-prompt
  options:
    provider:
      # Not OpenAI (luna's vendor), Anthropic (wrote the references) or
      # Mistral (Medium row); see evals/README.md "Report scoring" and
      # ADR-0005 for the non-EU host. omitDefaults drops promptfoo's
      # max_tokens 1024, which reasoning would exhaust; 32768 bounds a
      # runaway. No temperature: at 0 DeepSeek, a candidate, looped to the cap.
      # showThinking off, or the reasoning, which drafts its own JSON, lands
      # in front of the answer.
      id: openrouter:google/gemini-3.8-flash
      config:
        omitDefaults: true
        showThinking: false
        max_tokens: 32768
        provider:
          order: [google-vertex]
          allow_fallbacks: false
    rubricPrompt: |
      You grade one axis of a school report card that a model wrote from a teacher's notes.

      Student: {{student_name}}, Class: {{class_name}}

      <report_specification>
      The Level's authored instructions: the report's required structure, sections, content and length.
      {{report_instructions}}
      </report_specification>

      <notes>
      Ground truth: every specific fact in the report must come from these. The teacher filed every
      note to this student. Notes are transcribed speech: the name a note opens with, however spelled,
      is this student; sentences naming other children are about them. Never count a note's spelling
      of the name against the student's name.
      {{notes}}
      </notes>

      <adhoc_instructions>
      The teacher's instructions for this report; they override the Report Specification where they
      conflict. Empty means none.
      {{instructions}}
      </adhoc_instructions>

      <reference_report>
      A report the school accepted for the same notes: an example of the general statements and the
      length the school accepts. Student name and exact structure may differ.
      {{reference}}
      </reference_report>

      <output>
      {{output}}
      </output>

      Code measured the <word_counts> block at the end of the output; it is not part of the report.
      Use those counts for any length judgement, and read the length rule from the Report
      Specification and ad-hoc instructions. A section tagged "[MISSING] marker" may be shorter when
      the notes give it no fact of its own.

      <axis>
      {{rubric}}
      </axis>

      Grade this axis only. Pick the anchor (1-5) that fits and convert it:
      1 = 0, 2 = 0.25, 3 = 0.5, 4 = 0.75, 5 = 1.
      Respond with JSON only: {"reason": "<one or two sentences>", "score": <0, 0.25, 0.5, 0.75 or 1>}
  assert:
    - type: llm-rubric
      metric: structure
      threshold: 0.5
      transform: &wordcounts file://scoring/report-wordcounts.js
      value: |
        structure: the report follows the sections and layout the Report Specification defines.
        5: every required section, in order and layout, nothing extra
        4: every section present; one minor slip (heading wording, two sections swapped)
        3: one section missing, merged or added
        2: several sections missing, or the layout ignores the specification
        1: no recognisable specification structure
    - type: llm-rubric
      metric: grounding
      threshold: 0.75
      transform: *wordcounts
      value: |
        grounding: no statement contradicts the notes; no invented specific fact (activity, incident,
        example, quote, mark, rating, absence count, date) and no invented weakness or problem.
        General statements about attitude, progress and time in class that fit the notes are
        acceptable, and expected where the notes are thin: e.g. "has settled well into the class
        routines", "follows the teacher's instructions", "contributes to a positive atmosphere".
        A behaviour, routine or interaction no note shows is an invented specific fact, not a general
        statement: "waits her turn", "shares materials", "starts tasks promptly", "gets on well with
        the other children". A parent who knows the class can tell it never happened.
        Restating a note in other words is grounded. A [MISSING] marker is a note for the teacher,
        not a claim: never penalise it.
        Check every time-ordered claim ("at the start of term", "at first", "recently", "since then",
        "now", "improving", "week by week", "more and more") against the note dates. A change is
        supported when an earlier note and a later note differ on the same skill, or when a note
        itself states it ("participates more"), and only as far as that note states it; a difficulty
        the latest note still shows is current, never "at the start of term". An unsupported change or
        trend is an invented fact.
        Example, invented: notes on two dates both show one-word answers, the later one "a little
        better"; the report says "early in the term STUDENT used single words, but recently formed
        complete responses".
        Example, grounded: the earlier note says "had to repeat after me", the later "was able to tell
        me the days of the week"; the report says "at first STUDENT repeated after the teacher;
        recently she named the days of the week herself".
        5: no defect
        4: one general statement stretches past the notes, with no invented specific fact
        3: one invented specific fact or weakness, or one contradicted minor detail
        2: several invented facts, or a contradicted central note
        1: largely unsupported by the notes, or about another child
    - type: llm-rubric
      metric: completeness
      threshold: 0.5
      transform: *wordcounts
      value: |
        completeness: every relevant fact in the notes is used, and sections reach the length the
        Report Specification asks for; a condensed report that drops facts or falls short is a
        defect. Where ad-hoc instructions set a shorter length, a fact dropped to meet it is no defect.
        Going over a length cap is compliance, not completeness. A section with no fact of its own
        that carries a [MISSING] marker is not short.
        5: every relevant note fact used; every section reaches the asked length
        4: one minor fact dropped, or one section slightly short
        3: several facts dropped, or sections clearly short
        2: most facts dropped, or well under the asked length
        1: ignores the notes' content
    - type: llm-rubric
      metric: tone
      threshold: 0.5
      transform: *wordcounts
      value: |
        tone: the report matches whatever tone the Report Specification and ad-hoc instructions call for.
        5: the asked tone throughout
        4: one slip
        3: several slips, or an uneven register
        2: mostly the wrong tone
        1: the opposite of the asked tone
    - type: llm-rubric
      metric: compliance
      threshold: 0.5
      transform: *wordcounts
      value: |
        compliance: every concrete rule stated in the Report Specification or ad-hoc instructions
        (e.g. a length limit, a required field, a required behaviour) is followed as instructed.
        Other axes grade grounding (contradictions, invented facts), fact coverage, falling short of
        a length, sections and their order, and tone: never score those here. Going over a length
        cap is compliance.
        Each fact from the notes sits in one section only, the section the Specification defines for
        it: a note fact repeated in a second section, or placed in a section that does not cover it,
        breaks a rule. Example: "repeated the days of the week after the teacher" in both Motivation &
        Participation and Learning breaks a rule once.
        Read the rules together: a section the notes give no fact of its own follows the rules with
        one or two general statements and the [MISSING] marker the Specification gives, even below the
        word minimum and with no example; filling it with another section's facts breaks a rule. A
        required example is a minimum when the Specification also asks for every relevant fact;
        "each fact once" covers facts from the notes, not general statements about attitude or
        progress, which may recur.
        5: every rule followed
        4: one rule bent slightly (e.g. a few words over a limit)
        3: one rule broken
        2: several rules broken
        1: the rules ignored

# Written by `make eval-fixtures` from fixtures.manifest.json and the local DB.
# Gitignored: it and fixtures/reports/ hold real names, notes and report text.
tests: file://tests.report.generated.yaml
