description: GradeBee LLM evaluation harness — Report domain

# Single prompt function — dispatches to build-report-prompt via vars.task.
prompts:
  - label: gradebee-prompt
    raw: exec:../bin/eval-cli

# Providers — native Mistral/OpenAI providers for report generation.
# gradebee-report is the canonical (production) provider — used for baseline
# diffing and the sole provider stored in baseline.json.
providers:
  - id: mistral:mistral-medium-2508
    label: gradebee-report

  # Comparison / experimental providers:
  - id: mistral:mistral-medium-3-5
    label: gradebee-report-1
  - id: mistral:mistral-small-2603
    label: gradebee-report-3
  - id: openai:chat:gpt-5.4-mini
    label: gradebee-report-openai
    config:
      reasoning_effort: 'high'
  - id: mistral:mistral-small-2603
    label: gradebee-report-4
    config:
      reasoning_effort: 'high'
      temperature: 0.3
      max_tokens: 30000
    transform: |
      // When reasoning_effort is set, the model returns content blocks as an array
      // (e.g. [{type:'thinking',...},{type:'text',...}]). Strip thinking blocks
      // so llm-rubric only sees the final answer text.
      if (Array.isArray(output)) {
        return output.filter(b => b.type === 'text').map(b => b.text).join('');
      }
      return output;

# Default options: use a stronger judge model for llm-rubric assertions.
defaultTest:
  options:
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0

# Shared rubric template — every case grades adherence to the Level's
# report_instructions only. Report Examples are removed (#54); ad-hoc
# instructions (teacher overrides) still rank above the Level's
# report_instructions.
rubric_template: &rubric_template |
  Report Specification (the Level's authored instructions — this defines the
  required structure, sections, and content; the report must follow it):
  {{report_instructions}}

  Source notes (ground truth — every statement in the report must be traceable to these):
  {{notes}}

  Ad-hoc instructions for this run (override the Report Specification where they conflict, if present):
  {{instructions}}

  Reference report (a known-good output for the same notes — use as a quality benchmark, student
  name and exact structure may differ from the Report Specification above):
  {{reference}}

  Score 1-5 on:
  - structure: follows the sections and layout defined in the Report Specification
  - grounding: every statement traceable to notes (no invented observations, no fabricated marks,
    absences counts, or other metadata not present in the notes)
  - tone: matches whatever tone the Report Specification and ad-hoc instructions call for
  - compliance: any concrete rule stated in the Report Specification or ad-hoc instructions (e.g. a
    length limit, a required field, a required behaviour) is followed as instructed

tests:
  - description: "report: mousy-level structured format with a paragraph-length ad-hoc instruction"
    vars:
      task: build-report-prompt
      student_name: "Lucas"
      class_name: "Linda-Thursday@17:25"
      notes: "file://fixtures/reports/mousy_with_instructions/notes.json"
      report_instructions: "file://fixtures/reports/mousy_with_instructions/report_instructions.txt"
      instructions: "file://fixtures/reports/mousy_with_instructions/instructions.txt"
      reference: "file://fixtures/reports/mousy_with_instructions/reference.html"
    assert:
      - type: llm-rubric
        value: *rubric_template

  - description: "report: Emma Saturday class with Level instructions and multi-note synthesis"
    vars:
      task: build-report-prompt
      student_name: "Chloé"
      class_name: "Emma Saturday"
      notes: "file://fixtures/reports/chloe_emma_saturday/notes.json"
      report_instructions: "file://fixtures/reports/chloe_emma_saturday/report_instructions.txt"
      instructions: ""
      reference: "file://fixtures/reports/chloe_emma_saturday/reference.html"
    assert:
      - type: llm-rubric
        value: *rubric_template

  - description: "report: Oliver Thursday class with Level instructions and mood/behaviour challenges"
    vars:
      task: build-report-prompt
      student_name: "Mila"
      class_name: "Oliver Thursday"
      notes: "file://fixtures/reports/mila_oliver_thu/notes.json"
      report_instructions: "file://fixtures/reports/mila_oliver_thu/report_instructions.txt"
      instructions: ""
      reference: "file://fixtures/reports/mila_oliver_thu/reference.html"
    assert:
      - type: llm-rubric
        value: *rubric_template

  - description: "report: Oliver-Group 2 Saturday class with Level instructions and calm/positive profile"
    vars:
      task: build-report-prompt
      student_name: "Camille"
      class_name: "Oliver-Group 2 Saturday"
      notes: "file://fixtures/reports/camille_oliver_group2/notes.json"
      report_instructions: "file://fixtures/reports/camille_oliver_group2/report_instructions.txt"
      instructions: ""
      reference: "file://fixtures/reports/camille_oliver_group2/reference.html"
    assert:
      - type: llm-rubric
        value: *rubric_template
