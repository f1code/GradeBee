description: GradeBee LLM evaluation harness — Extraction domain

# Single prompt function — dispatches to build-extract-prompt via vars.task.
prompts:
  - label: gradebee-prompt
    raw: exec:../bin/eval-cli

# Providers — native Mistral providers with structured output (json_schema).
#
# gradebee-extract is the canonical provider: diff-baseline.js tracks it for
# regressions, so it must stay pinned to the model production actually runs.
# TestEvalConfigsTrackProductionModels (backend/evals_config_test.go) fails if
# it drifts from defaultModels() in llm_provider.go.
providers:
  - id: mistral:mistral-medium-2508
    label: gradebee-extract
    config: &extract_schema
      response_format:
        type: json_schema
        json_schema:
          # Pass 2's schema, mirroring passageSchema() in backend/extract.go.
          # Property order is the model's generation order under structured
          # output, and spoken_labels before student is what stops the model
          # picking a child and then inventing a label for it — keep them in
          # this order.
          #
          # Deliberate divergence, the same one already accepted for the old
          # contract's class_name: in production `student` is an enum of the
          # pinned class's roster, and a static provider config cannot
          # template a per-fixture roster. scoring/assemble.js resolves the
          # value against the fixture's roster instead. Measured before
          # settling for it: over 16 runs of fuzzy_name_matching the enum
          # changed no score and the model returned no name off the roster
          # without it. Update this block if ExtractedPassage's shape changes.
          name: passages
          strict: true
          schema:
            type: object
            properties:
              observations:
                type: array
                items:
                  type: object
                  properties:
                    kind:          { type: string, enum: [child, unknown, group, none] }
                    spoken_labels: { type: array, items: { type: string } }
                    student:       { type: string }
                    summary:       { type: string }
                  required: [kind, spoken_labels, student, summary]
                  additionalProperties: false
            required: [observations]
            additionalProperties: false

  # Comparison provider. Not tracked for regressions — it is the weaker model,
  # kept so a prompt change that outgrows mistral-small shows up as a widening
  # gap against the canonical row before it reaches production's model.
  - id: mistral:mistral-small-2603
    label: gradebee-extract-small
    config: *extract_schema

# Default options for every row.
#
# transform folds pass 2's passages into the per-child notes scoring/extraction.js
# grades — it is the JavaScript twin of guardPassages (backend/extract.go) and
# assemblePassages (backend/voice_note_passages.go). It runs before the
# assertions, so every row below is scored on what a teacher would read, not on
# the model's raw output. See the header of scoring/assemble.js.
#
# The judge model is for the report config's llm-rubric assertions; extraction
# is scored by the custom scorer.
defaultTest:
  options:
    transform: file://scoring/assemble.js
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0

tests:
  - description: "extraction: preserves teacher voice (no paraphrasing)"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/voice_preservation/transcript.txt"
      classes: "file://fixtures/extraction/voice_preservation/classes.json"
      class_name: "Class A"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/voice_preservation/expected.json
          metric: voice_preservation

  # multi_class is not here. Every row is a pass-2 row — build-extract-prompt is
  # the pass-2 builder and needs a class_name var — and that fixture's class is
  # the thing under test: it names two classes inline with no header, and the
  # right answer is pass 1 declining. It is asserted against the real
  # classPickSchema in backend/llm_live_test.go instead. See README.md.

  - description: "extraction: fuzzy name matching (Inaia→Inaya, Liana→Lina)"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/fuzzy_name_matching/transcript.txt"
      classes: "file://fixtures/extraction/fuzzy_name_matching/classes.json"
      class_name: "Marcia · Wed · 14:10"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/fuzzy_name_matching/expected.json
          metric: precision_recall

  - description: "extraction: keeps each student's note free of other students' observations"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/cross_student_bleed/transcript.txt"
      classes: "file://fixtures/extraction/cross_student_bleed/classes.json"
      class_name: "Oliver · Thu"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/cross_student_bleed/expected.json
          metric: attribution

  - description: "extraction: applies group observation only to relevant class"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/group_observation/transcript.txt"
      classes: "file://fixtures/extraction/group_observation/classes.json"
      class_name: "Class B"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/group_observation/expected.json
          metric: precision_recall

  - description: "extraction: pronoun run after an unmatched name stays out of every entry"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/pronoun_run_bleed/transcript.txt"
      classes: "file://fixtures/extraction/pronoun_run_bleed/classes.json"
      class_name: "Marta · Wed · 17.45"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/pronoun_run_bleed/expected.json
          metric: attribution

  # Green on this contract, red under a passage contract — see
  # evals/README.md, "Fixtures #125 owns".

  - description: "extraction: two children in one exchange keep separate notes"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/shared_clause/transcript.txt"
      classes: "file://fixtures/extraction/shared_clause/classes.json"
      class_name: "Sandrine · Tue · 16.30"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/shared_clause/expected.json
          metric: attribution

  - description: "extraction: a spoken first name resolves against a full-name roster"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/full_name_roster/transcript.txt"
      classes: "file://fixtures/extraction/full_name_roster/classes.json"
      class_name: "Class A"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/full_name_roster/expected.json
          metric: precision_recall

  # Numbered twins (#111): `Arthur 1` and `Arthur 2` on the roster. The
  # number is the only thing telling them apart, so it must reach the
  # matcher as a discriminator.

  - description: "extraction: numbered twins resolve by their number"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/numbered_roster/transcript.txt"
      classes: "file://fixtures/extraction/numbered_roster/classes.json"
      class_name: "Class A"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/numbered_roster/expected.json
          metric: precision_recall

  # A group observation whose content is a date (#117). The "none" bullet
  # lists both "the date" and "vocabulary the children are being taught";
  # the drill sentence is superficially both, but the children are its
  # subject, so it is a group observation and belongs in every note. The
  # two children carry each other's opening as a must-not, which is what
  # keeps the row honest: without them, copying the whole transcript into
  # every note would satisfy all four positives and pass. "Quentin 1520" as
  # a must-not keeps the header out of every note.

  - description: "extraction: a date the children practise reaches every child"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/date_drill/transcript.txt"
      classes: "file://fixtures/extraction/date_drill/classes.json"
      class_name: "Quentin · Wed · 15.20"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/date_drill/expected.json
          metric: voice_preservation

  # Note 694's shape at the roster order that produces the phantom (#125). The
  # unnamed "she" block must reach no note: the prompt's no-elimination rules
  # take that from 8/10 to 0/10, and the Go guard — mirrored in
  # scoring/assemble.js — catches whatever is left. Anaëlle is first on the
  # roster and never named, which is the slot the block used to fall into.

  - description: "extraction: an unnamed block is not filed under the first child on the roster"
    vars:
      task: build-extract-prompt
      transcript: "file://fixtures/extraction/roster_phantom/transcript.txt"
      classes: "file://fixtures/extraction/roster_phantom/classes.json"
      class_name: "Ludivine · Thu · 16.15"
    assert:
      - type: javascript
        value: file://scoring/extraction.js
        config:
          expected: file://fixtures/extraction/roster_phantom/expected.json
          metric: attribution
