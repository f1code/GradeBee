packages:
  - path: "github.com/nicogaller/gradebee/backend"
    output_path: "../frontend/src/api-types.gen.ts"
    type_mappings:
      "time.Time": "string"
    exclude_files:
      - "job_queue.go"
      - "job_queue_mem.go"
      # The model's contract is not this API's. Nothing on the wire carries an
      # ExtractRequest, an ExtractResponse or an ExtractedPassage, and emitting
      # them put Go-cased field names in a file that is meant to describe what
      # the frontend actually receives. The done card's view of a passage is
      # JobPassage (voice_note_job.go), which arrives via VoiceNoteJob.
      - "extract.go"
    include_types:
      # Core entities
      - Note
      - Student
      - ClassWithCount
      - Level
      - Report
      - ReportSummary
      # List response wrappers
      - ListNotesResponse
      - ListClassesResponse
      - ListStudentsResponse
      - ListReportsResponse
      - ListLevelsResponse
      # Request/response types
      - ReportResult
      - GenerateReportsHTTPRequest
      - GenerateReportsHTTPResponse
      - ReportStudentInput
      - RegenerateReportHTTPRequest
      - UploadResponse
      - DriveImportRequest
      - DriveImportResponse
      - GoogleTokenResponse
      - VoiceNoteJob
      - NoteLink
      - JobListResponse
      # Roster shapes the eval fixtures are typed against.
      - ClassGroup
      - ClassStudent
