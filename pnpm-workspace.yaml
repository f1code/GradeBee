packages:
  - '.'
  - 'frontend'
  - 'backend/evals'
allowBuilds:
  '@clerk/shared': true
  '@playwright/browser-chromium': false
  '@swc/core': false
  better-sqlite3: true
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  puppeteer: true
  sharp: false
catalog:
  # Must track .nvmrc / engines — types ahead of the runtime let a
  # typecheck pass on an API the runtime does not have.
  '@types/node': ^24.10.1
  typescript: ~6.0.2
